name: Issue Triage
description: Template for reporting bugs or requesting features
title: "[Triage] "
labels: ["triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Thanks for opening an issue!

        Please fill out this template to help us understand your request.

  - type: dropdown
    id: issue-type
    attributes:
      label: Issue Type
      description: What type of issue is this?
      options:
        - Bug Report
        - Feature Request
        - Documentation Issue
        - Question
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Detailed description of the issue or feature request
      placeholder: |
        Please describe the issue or feature in detail.
        Include steps to reproduce if this is a bug.
    validations:
      required: true

  - type: input
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: |
        Describe what you expected to happen
    validations:
      required: false

  - type: input
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: |
        Describe what actually happened
    validations:
      required: false

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your environment details
      placeholder: |
        - OS: [e.g., Windows 10, macOS, Linux]
        - Browser: [e.g., Chrome, Firefox, Safari]
        - Node version: [e.g., v20.0.0]
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Please include any relevant console logs or error messages
      placeholder: |
        Paste any relevant logs here
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem
      placeholder: |
        Drag and drop or paste images here
    validations:
      required: false
